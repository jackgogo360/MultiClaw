[app]
name = "MultiClaw"
version = "0.1.0"
debug = true

[deployment]
profile = "standalone"

[database]
driver = "sqlite"
url = "sqlite+aiosqlite:///data/multiclaw.db"
migration_mode = "validate"
sqlite_busy_timeout_ms = 5000

[workspace]
root = "data/workspaces"

[runtime]
max_resident_tenants = 32
idle_ttl_seconds = 900
max_concurrent_runs_per_tenant = 2
max_run_seconds = 1800
max_run_tokens = 250000
tenant_daily_token_limit = 0
max_queued_messages = 20
max_stream_events = 10000

[workflow]
heartbeat_ms = 5000
lease_ttl_ms = 20000
max_checkpoint_payload_bytes = 262144

[secrets]
allow_platform_fallback = false
# Set MULTICLAW_SECRETS_KEYRING_B64 in the environment when needed.
keyring_file = ""

[deletion]
retention_days = 7

[planning]
enabled = true
default_mode = "never"
classification_model = ""
generation_model = ""
max_steps = 20
max_dependency_depth = 10
max_revisions = 5
max_step_attempts = 2

[llm]
default_provider = "deepseek"
default_model = "deepseek-v4-pro"
max_retries = 2
retry_base_seconds = 0.25

[llm.model_providers]
"gpt-4o-mini" = "openai"
"claude-sonnet-4-6" = "anthropic"
"deepseek-chat" = "deepseek"
"deepseek-v4-pro" = "deepseek"

[llm.providers.openai]
api_key = ""
base_url = "https://api.openai.com/v1"

[llm.providers.anthropic]
api_key = ""
base_url = "https://api.anthropic.com"

[llm.providers.deepseek]
api_key = ""
base_url = "https://api.deepseek.com/v1"

[llm.capability_tags]
"gpt-4o-mini" = ["text", "function_calling"]
"claude-sonnet-4-6" = ["text", "function_calling", "extended_thinking"]
"deepseek-chat" = ["text", "function_calling", "streaming"]
"deepseek-v4-pro" = ["text", "function_calling", "streaming"]

[memory]
short_term_limit = 100
context_window_limit = 128000
progressive_context_enabled = true
context_response_reserve_tokens = 4096

[governance]
audit_enabled = true

[governance.sandbox]
mode = "auto"
backend_probe_on_startup = true
unsafe_fallback_requires_debug = true
write_protected_workspace_paths = [".git"]
read_hidden_workspace_paths = [".env", ".env.*"]

[agent]
max_tool_rounds = 100
resilience_enabled = true

[auth]
# Set MULTICLAW_AUTH_JWT_SIGNING_KEY in the environment when needed.
jwt_signing_key_file = ""

[email]
provider = "resend"

[brevo]
api_key = ""
sender_email = "felixgogo360@gmail.com"
sender_name = "MultiClaw"
mock = true

[resend]
api_key = ""
sender_email = "multi-claw@mail.bigrouter.cc"
sender_name = "MultiClaw"
mock = false

[mcp]
enabled = true
