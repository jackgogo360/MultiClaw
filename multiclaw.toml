[app]
name = "MultiClaw"
version = "0.1.0"
debug = true

[database]
path = "data/multiclaw.db"

[llm]
default_provider = "deepseek"
default_model = "deepseek-v4-pro"

[llm.providers.openai]
api_key = "sk-your-key-here"
base_url = "https://api.openai.com/v1"

[llm.providers.anthropic]
api_key = "sk-ant-your-key-here"
base_url = "https://api.anthropic.com"

[llm.providers.deepseek]
api_key = "sk-f774c9e2f8d84e60b77e1f5dad0e54f2"
base_url = "https://api.deepseek.com/v1"

[llm.capability_tags]
"gpt-4o-mini" = ["text", "function_calling"]
"claude-sonnet-4-6" = ["text", "function_calling", "extended_thinking"]
"deepseek-chat" = ["text", "function_calling", "streaming"]
"deepseek-v4-pro" = ["text", "function_calling", "streaming"]

[memory]
short_term_limit = 100
context_window_limit = 128000

[governance]
audit_enabled = true

[governance.sandbox]
mode = "auto"
backend_probe_on_startup = true
unsafe_fallback_requires_debug = true
write_protected_workspace_paths = [".git"]
read_hidden_workspace_paths = [".env", ".env.*"]

[agent]
max_tool_rounds = 10

[auth]
# jwt_secret is auto-generated and persisted in DB — leave empty
jwt_secret = ""

[email]
provider = "resend"

[brevo]
api_key = "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"
sender_email = "felixgogo360@gmail.com"
sender_name = "MultiClaw"
mock = true

[resend]
api_key = "re_8fKwesNy_NksESPrbQm5whhUvFQs7cjq2"
sender_email = "multi-claw@mail.bigrouter.cc"
sender_name = "MultiClaw"
mock = false

[mcp]
enabled = true
