[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multiclaw"
version = "0.1.0"
description = "MultiClaw Agent Runtime"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "ddgs>=9.14.4",
    "html2text>=2025.4.15",
    "trafilatura>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
