[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multiclaw"
version = "0.1.0"
description = "MultiClaw Agent Runtime"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]