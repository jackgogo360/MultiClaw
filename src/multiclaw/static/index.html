<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiClaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg-base: #1a1a1c;
    --bg-surface: #212124;
    --bg-elevated: #2a2a2e;
    --bg-input: #1e1e21;
    --border: #2e2e32;
    --border-hover: #3e3e44;
    --text-primary: #ececee;
    --text-secondary: #9d9da6;
    --text-tertiary: #6b6b75;
    --accent: #d4a853;
    --accent-soft: rgba(212, 168, 83, 0.12);
    --accent-glow: rgba(212, 168, 83, 0.25);
    --user-bubble: #2d2a23;
    --user-border: #3e3830;
    --danger: #e5534b;
    --danger-soft: rgba(229, 83, 75, 0.12);
    --success: #57ab5a;
    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --font-body: 'DM Sans', -apple-system, sans-serif;
    --font-display: 'Newsreader', Georgia, serif;
    --font-mono: 'DM Mono', 'SF Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    background: var(--bg-base);
    color: var(--text-primary);
    display: flex; justify-content: center; align-items: center;
    height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* subtle grain overlay */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    opacity: 0.6;
  }
  #app { width: 100%; height: 100vh; display: flex; flex-direction: row; position: relative; z-index: 1; overflow: hidden; }

  /* ---- sidebar ---- */
  #sidebar {
    width: 260px; border-right: 1px solid var(--border); display: flex; flex-direction: column;
    background: var(--bg-surface); flex-shrink: 0;
  }
  #sidebar-brand { padding: 20px 20px 16px; }
  #sidebar-brand h1 { font-family: var(--font-display); font-size: 22px; font-weight: 500; color: var(--text-primary); letter-spacing: -0.3px; }
  #sidebar-brand .badge { font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.8px; text-transform: uppercase; margin-top: 2px; display: block; }
  #session-list { flex: 1; overflow-y: auto; padding: 0 10px; }
  #session-list::-webkit-scrollbar { width: 4px; }
  #session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .session-item {
    padding: 10px 14px; border-radius: var(--radius); margin-bottom: 2px; cursor: pointer;
    font-size: 13px; color: var(--text-secondary); transition: all 0.15s ease;
    display: flex; align-items: center; gap: 10px;
  }
  .session-item:hover { background: var(--bg-elevated); color: var(--text-primary); }
  .session-item.active { background: var(--accent-soft); color: var(--accent); }
  .session-item .icon { width: 18px; height: 18px; border-radius: 6px; background: var(--bg-elevated); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 10px; }
  .session-item.active .icon { background: var(--accent-glow); }
  .session-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
  #new-session-btn {
    width: 100%; padding: 10px; background: transparent; color: var(--text-secondary); border: 1px dashed var(--border);
    border-radius: var(--radius); cursor: pointer; font-size: 13px; font-family: var(--font-body);
    transition: all 0.15s ease; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  #new-session-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* ---- main ---- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  #main-top { padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center;
    justify-content: space-between; min-height: 52px; }
  #current-session-title { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
  #sidebar-toggle { display: none; background: none; border: none; color: var(--text-secondary); cursor: pointer;
    font-size: 18px; padding: 4px 8px; border-radius: 6px; }
  #sidebar-toggle:hover { background: var(--bg-elevated); }

  /* ---- messages ---- */
  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 4px;
    scroll-behavior: smooth; }
  #messages::-webkit-scrollbar { width: 5px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  #messages::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  /* empty welcome */
  .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--text-tertiary); text-align: center; padding: 40px; }
  .welcome-icon { font-size: 48px; margin-bottom: 8px; opacity: 0.6; }
  .welcome h3 { font-family: var(--font-display); font-size: 22px; font-weight: 500; color: var(--text-secondary);
    letter-spacing: -0.3px; }
  .welcome p { font-size: 13px; line-height: 1.7; max-width: 420px; }

  /* ---- message bubbles ---- */
  .msg-wrap { display: flex; flex-direction: column; padding: 8px 0; animation: msgIn 0.3s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-wrap.user { align-items: flex-end; }
  .msg-wrap.agent { align-items: flex-start; }

  .msg {
    max-width: 72%; padding: 12px 18px; border-radius: var(--radius-lg); line-height: 1.65;
    font-size: 14px; position: relative;
  }
  .msg-wrap.user .msg {
    background: var(--user-bubble); border: 1px solid var(--user-border);
    border-bottom-right-radius: 6px; color: var(--text-primary);
  }
  .msg-wrap.agent .msg {
    background: transparent; border: none; padding: 12px 0;
    border-radius: 0; color: var(--text-primary);
  }
  .msg-wrap.agent .msg { padding-left: 0; padding-right: 0; }
  .msg .label { display: none; }

  /* markdown inside messages */
  .msg h1, .msg h2, .msg h3 { font-family: var(--font-display); margin: 16px 0 6px; font-size: 1.15em;
    font-weight: 500; color: var(--text-primary); letter-spacing: -0.2px; }
  .msg h1:first-child, .msg h2:first-child, .msg h3:first-child { margin-top: 0; }
  .msg p { margin: 6px 0; }
  .msg p:first-child { margin-top: 0; }
  .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { padding-left: 22px; margin: 6px 0; }
  .msg li { margin: 3px 0; }
  .msg code {
    background: var(--bg-elevated); padding: 2px 6px; border-radius: 5px;
    font-family: var(--font-mono); font-size: 12px; color: var(--accent);
  }
  .msg pre {
    background: #111113; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin: 10px 0; overflow-x: auto; font-size: 12px;
    line-height: 1.55;
  }
  .msg pre code { background: none; padding: 0; color: var(--text-primary); font-size: 12px; }
  .msg blockquote {
    border-left: 2px solid var(--accent); padding-left: 14px; margin: 8px 0;
    color: var(--text-secondary); font-style: italic;
  }
  .msg table { border-collapse: collapse; margin: 8px 0; font-size: 13px; width: 100%; }
  .msg th { background: var(--bg-elevated); font-weight: 500; }
  .msg th, .msg td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  .msg a { color: var(--accent); text-decoration: none; }
  .msg a:hover { text-decoration: underline; }

  /* ---- tool cards ---- */
  .tool-card {
    align-self: flex-start; max-width: 72%; margin: 4px 0; animation: msgIn 0.3s ease;
  }
  .tool-card summary {
    font-size: 12px; color: var(--text-tertiary); cursor: pointer; padding: 6px 0;
    display: flex; align-items: center; gap: 6px; user-select: none;
  }
  .tool-card summary .dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .tool-card summary .dot.running { background: var(--accent); animation: pulse 1.5s ease-in-out infinite; }
  .tool-card summary .dot.done { background: var(--success); }
  .tool-card summary .dot.error { background: var(--danger); }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  .tool-card .tool-body {
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-top: 2px; font-size: 13px;
  }
  .tool-card .tool-body pre {
    background: #111113; border-radius: var(--radius-sm); padding: 10px 12px;
    font-family: var(--font-mono); font-size: 11px; overflow-x: auto; color: var(--text-secondary);
    margin: 0;
  }

  /* ---- approval ---- */
  @keyframes approvalPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212, 168, 83, 0.25), 0 0 20px rgba(212, 168, 83, 0.05); }
    50% { box-shadow: 0 0 0 6px rgba(212, 168, 83, 0.06), 0 0 36px rgba(212, 168, 83, 0.12); }
  }
  @keyframes approvalSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shieldReveal {
    from { opacity: 0; transform: scale(0.6); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes resolveFlash { 0% { opacity: 1; } 40% { opacity: 0.5; } 60% { opacity: 0.5; } 100% { opacity: 1; } }

  .approval-card {
    align-self: flex-start; max-width: 72%; width: 380px; margin: 4px 0;
    background: linear-gradient(165deg, #252528 0%, #1e1e22 100%);
    border: 1px solid rgba(212, 168, 83, 0.28);
    border-radius: var(--radius-xl);
    padding: 0; overflow: hidden;
    animation: approvalSlideUp 0.4s cubic-bezier(0.22, 0.61, 0.36, 1), approvalPulse 3s ease-in-out infinite;
    position: relative;
  }
  /* reflective top edge */
  .approval-card::before {
    content: ''; display: block; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 168, 83, 0.35), transparent);
    opacity: 0.7;
  }
  /* card inner structure */
  .approval-card-inner { padding: 14px 16px 12px; }

  /* ---- header row ---- */
  .approval-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .approval-shield {
    width: 24px; height: 28px; flex-shrink: 0;
    animation: shieldReveal 0.5s 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .approval-shield svg { width: 100%; height: 100%; }
  .approval-header-text { display: flex; flex-direction: column; gap: 1px; }
  .approval-header-text .label {
    font-size: 8px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600;
    color: var(--accent); opacity: 0.85;
  }
  .approval-header-text .tool-name {
    font-size: 14px; font-weight: 500; color: var(--text-primary);
    font-family: var(--font-body); letter-spacing: -0.2px;
  }

  /* ---- params block ---- */
  .approval-card .params {
    font-size: 11px; color: #8b8b95; font-family: var(--font-mono);
    background: #141418; padding: 8px 10px; border-radius: var(--radius-sm);
    margin-bottom: 10px; line-height: 1.4; max-height: 80px; overflow-y: auto;
    border: 1px solid rgba(255, 255, 255, 0.04);
  }
  .approval-card .params::-webkit-scrollbar { width: 3px; }
  .approval-card .params::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ---- approval description ---- */
  .approval-card .approval-desc {
    font-size: 13px; color: var(--text-secondary); line-height: 1.5;
    margin-bottom: 6px; word-break: break-word;
  }
  .approval-card .approval-details {
    margin-bottom: 8px;
  }
  .approval-card .approval-details summary {
    font-size: 10px; color: var(--text-tertiary); cursor: pointer;
    padding: 2px 0; user-select: none;
  }
  .approval-card .approval-details pre {
    background: #111113; border-radius: var(--radius-sm); padding: 8px 10px;
    font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary);
    margin: 4px 0 0; max-height: 100px; overflow-y: auto; white-space: pre-wrap;
  }

  /* ---- actions ---- */
  .approval-card .actions { display: flex; gap: 8px; }
  .approval-card .actions button {
    flex: 1; padding: 8px 14px; border-radius: var(--radius-sm); border: none;
    font-size: 13px; font-family: var(--font-body); font-weight: 500; cursor: pointer;
    transition: all 0.2s cubic-bezier(0.22, 0.61, 0.36, 1);
    letter-spacing: 0.2px; position: relative; overflow: hidden;
  }
  .approval-card .approve-btn {
    background: linear-gradient(135deg, #d4a853 0%, #c4963d 100%);
    color: #1a1a1c; box-shadow: 0 2px 12px rgba(212, 168, 83, 0.2);
  }
  .approval-card .approve-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(212, 168, 83, 0.35);
  }
  .approval-card .approve-btn:active { transform: translateY(0); box-shadow: 0 1px 6px rgba(212, 168, 83, 0.3); }

  .approval-card .reject-btn {
    background: rgba(255, 255, 255, 0.04); color: var(--text-tertiary);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .approval-card .reject-btn:hover {
    background: rgba(229, 83, 75, 0.1); color: var(--danger);
    border-color: rgba(229, 83, 75, 0.3);
  }
  .approval-card .reject-btn:active { background: rgba(229, 83, 75, 0.18); }

  /* ---- resolved state ---- */
  .approval-card.resolved { animation: none; opacity: 0.85; }
  .approval-card.resolved .approval-shield { filter: grayscale(0.5); }
  .approval-card .resolution-badge {
    display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 500; letter-spacing: 0.2px;
  }
  .approval-card .resolution-badge.approved {
    background: rgba(87, 171, 90, 0.1); color: #6cc070;
    border: 1px solid rgba(87, 171, 90, 0.2);
  }
  .approval-card .resolution-badge.rejected {
    background: rgba(229, 83, 75, 0.08); color: #ea6d67;
    border: 1px solid rgba(229, 83, 75, 0.18);
  }

  /* ---- thinking ---- */
  .thinking-row { display: flex; align-items: center; gap: 8px; padding: 12px 0; animation: msgIn 0.3s ease; }
  .thinking-row span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary);
    animation: think 1.4s ease-in-out infinite; }
  .thinking-row span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-row span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes think { 0%, 60%, 100% { opacity: 0.2; transform: scale(0.7); }
    30% { opacity: 1; transform: scale(1); } }

  /* ---- reasoning (chain-of-thought) ---- */
  .reasoning-banner {
    margin: 4px 0; border-radius: var(--radius); overflow: hidden;
    border: 1px solid rgba(212, 168, 83, 0.15);
    animation: msgIn 0.3s ease;
  }
  .reasoning-banner summary {
    font-size: 11px; color: var(--accent); cursor: pointer; padding: 8px 12px;
    background: rgba(212, 168, 83, 0.06); user-select: none;
    display: flex; align-items: center; gap: 6px;
  }
  .reasoning-banner summary::before {
    content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); animation: pulse 1.5s ease-in-out infinite;
  }
  .reasoning-banner .reasoning-body {
    font-size: 12px; color: var(--text-secondary); font-family: var(--font-body);
    padding: 10px 14px; background: rgba(0,0,0,0.15); line-height: 1.6;
    max-height: 180px; overflow-y: auto;
  }

  /* ---- input ---- */
  #input-wrap { padding: 16px 24px 20px; }
  #input-area {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius-xl); padding: 6px 6px 6px 18px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  #input-area:focus-within { border-color: var(--border-hover); box-shadow: 0 0 0 3px var(--accent-soft); }
  #input-area textarea {
    flex: 1; background: none; border: none; color: var(--text-primary);
    font-size: 14px; font-family: var(--font-body); line-height: 1.5;
    outline: none; resize: none; padding: 8px 0; max-height: 160px;
  }
  #input-area textarea::placeholder { color: var(--text-tertiary); }
  #send-btn {
    background: var(--accent-soft); border: 1px solid transparent; border-radius: 50%;
    width: 38px; height: 38px; flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;
  }
  #send-btn svg { width: 16px; height: 16px; color: var(--accent); }
  #send-btn:hover { background: var(--accent); }
  #send-btn:hover svg { color: #1a1a1c; }
  #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #send-btn:disabled:hover { background: var(--accent-soft); }
  #send-btn:disabled:hover svg { color: var(--accent); }

  .hint { font-size: 11px; color: var(--text-tertiary); padding: 0 24px 0; text-align: center; }

  /* ---- error ---- */
  .msg-wrap.error .msg { background: var(--danger-soft); border: 1px solid var(--danger); color: var(--danger);
    border-radius: var(--radius); padding: 10px 16px; font-size: 13px; }

  /* responsive */
  @media (max-width: 680px) {
    #sidebar { display: none; }
    #sidebar-toggle { display: block; }
    .msg { max-width: 90%; }
    .tool-card, .approval-card { max-width: 90%; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-brand">
      <h1>MultiClaw</h1>
      <span class="badge">Developer Preview</span>
    </div>
    <div id="session-list"></div>
    <div id="sidebar-footer">
      <button id="new-session-btn" onclick="createSession()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
      </button>
    </div>
  </div>
  <div id="main">
    <div id="main-top">
      <h2 id="current-session-title">New Chat</h2>
      <button id="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar">&#9776;</button>
    </div>
    <div id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">&#x2699;&#xfe0f;</div>
        <h3>MultiClaw Agent</h3>
        <p>Ask me anything, run tools, or create plans. I can inspect files, list directories, and help you navigate the codebase.</p>
      </div>
    </div>
    <div class="hint">Try: <code>read src/multiclaw/server.py</code> &middot; <code>plan: research and write</code> &middot; <code>grep for session_id</code></div>
    <div id="input-wrap">
      <div id="input-area">
        <textarea id="input" rows="1" placeholder="Message MultiClaw..." autofocus></textarea>
        <button id="send-btn" onclick="send()" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
<script>
const msgs = document.getElementById('messages');
const input = document.getElementById('input');
const btn = document.getElementById('send-btn');
const welcome = document.getElementById('welcome');
let streamEl = null;
let streamContent = '';
let thinkingEl = null;
let reasoningEl = null;
let hasFirstToken = false;
let currentSessionId = null;
let sessions = [];

// ---- textarea auto-resize ----
input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});

// ---- welcome screen ----
function hideWelcome() {
  if (welcome) { welcome.style.display = 'none'; }
}

// ---- thinking indicator ----
function showThinking() {
  if (thinkingEl) return;
  thinkingEl = document.createElement('div');
  thinkingEl.className = 'thinking-row';
  thinkingEl.innerHTML = '<span></span><span></span><span></span>';
  msgs.appendChild(thinkingEl);
  scrollDown();
}

function removeThinking() {
  if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
}

// ---- reasoning (chain-of-thought) ----
function showReasoning(text) {
  hideWelcome();
  if (!reasoningEl) {
    reasoningEl = document.createElement('details');
    reasoningEl.className = 'reasoning-banner';
    reasoningEl.open = true;
    reasoningEl.innerHTML = '<summary>Thinking...</summary><div class="reasoning-body"></div>';
    msgs.appendChild(reasoningEl);
    scrollDown();
  }
  const body = reasoningEl.querySelector('.reasoning-body');
  body.textContent += text;
  scrollDown();
}

function clearReasoning() {
  if (reasoningEl) { reasoningEl.remove(); reasoningEl = null; }
}

// ---- streaming message ----
function ensureStreamEl() {
  if (!streamEl) {
    removeThinking();
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap agent';
    streamEl = document.createElement('div');
    streamEl.className = 'msg';
    streamEl.innerHTML = '<div class="stream-body"></div>';
    wrap.appendChild(streamEl);
    msgs.appendChild(wrap);
  }
}

function appendToken(token) {
  if (!hasFirstToken) { ensureStreamEl(); hasFirstToken = true; hideWelcome(); clearReasoning(); }
  streamContent += token;
  streamContent += token;
  const body = streamEl.querySelector('.stream-body');
  body.innerHTML = marked.parse(streamContent);
  scrollDown();
}

function finalizeStream(content) {
  clearReasoning();
  if (streamEl) {
    const body = streamEl.querySelector('.stream-body');
    body.innerHTML = marked.parse(content || streamContent);
    streamEl = null;
    streamContent = '';
    hasFirstToken = false;
  }
  removeThinking();
}

// ---- messages ----
function addMessage(role, content) {
  hideWelcome();
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + role;
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = role === 'agent' ? marked.parse(content) : escapeHtml(content);
  wrap.appendChild(div);
  msgs.appendChild(wrap);
  scrollDown();
  return wrap;
}

function addError(content) {
  hideWelcome();
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap error';
  const div = document.createElement('div');
  div.className = 'msg';
  div.textContent = content;
  wrap.appendChild(div);
  msgs.appendChild(wrap);
  scrollDown();
}

// ---- tool call / result ----
function showToolCall(name, args) {
  hideWelcome();
  removeThinking();
  clearReasoning();
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.id = 'tool-' + name + '-' + Date.now();
  card.innerHTML = '<details open><summary><span class="dot running"></span> Calling <strong>' + escapeHtml(name) + '</strong></summary><div class="tool-body"><pre>' + escapeHtml(JSON.stringify(args, null, 2)) + '</pre></div></details>';
  msgs.appendChild(card);
  scrollDown();
}

function showToolResult(name, content) {
  const cards = document.querySelectorAll('.tool-card');
  for (const card of cards) {
    const summary = card.querySelector('summary');
    if (summary && summary.textContent.includes(name) && card.querySelector('.dot.running')) {
      summary.querySelector('.dot').className = 'dot done';
      const body = card.querySelector('.tool-body');
      body.innerHTML = '<pre>' + escapeHtml(content) + '</pre>';
      break;
    }
  }
  showThinking();
  scrollDown();
}

// ---- approval ----
const SHIELD_SVG = '<svg viewBox="0 0 34 40" fill="none" xmlns="http://www.w3.org/2000/svg">' +
  '<path d="M17 0L1 6.5V18.5C1 29.5 8 37.5 17 40C26 37.5 33 29.5 33 18.5V6.5L17 0Z" ' +
  'fill="rgba(212,168,83,0.12)" stroke="rgba(212,168,83,0.4)" stroke-width="1.2" stroke-linejoin="round"/>' +
  '<path d="M17 8L17 27" stroke="rgba(212,168,83,0.35)" stroke-width="1.4" stroke-linecap="round"/>' +
  '<circle cx="17" cy="32" r="1.8" fill="rgba(212,168,83,0.6)"/>' +
  '<path d="M17 13L17 17" stroke="rgba(212,168,83,0.5)" stroke-width="2.2" stroke-linecap="round"/>' +
  '</svg>';

function showApproval(requestId, tool, params, description) {
  hideWelcome();
  removeThinking();
  clearReasoning();
  var desc = description || escapeHtml(JSON.stringify(params));
  var detailsOpen = !description; // only default-open if showing raw JSON
  var div = document.createElement('div');
  div.className = 'approval-card';
  div.id = 'approval-' + requestId;
  div.innerHTML =
    '<div class="approval-card-inner">' +
    '<div class="approval-header">' +
    '<div class="approval-shield">' + SHIELD_SVG + '</div>' +
    '<div class="approval-header-text">' +
    '<span class="label">Approval Required</span>' +
    '<span class="tool-name">' + escapeHtml(tool) + '</span>' +
    '</div>' +
    '</div>' +
    '<div class="approval-desc">' + escapeHtml(desc) + '</div>' +
    '<details class="approval-details"><summary>Raw params</summary><pre>' + escapeHtml(JSON.stringify(params, null, 2)) + '</pre></details>' +
    '<div class="actions">' +
    '<button class="approve-btn" id="approve-' + requestId + '">Approve</button>' +
    '<button class="reject-btn" id="reject-' + requestId + '">Reject</button>' +
    '</div>' +
    '</div>';
  msgs.appendChild(div);
  document.getElementById('approve-' + requestId).onclick = function() { resolveApproval(requestId, true); };
  document.getElementById('reject-' + requestId).onclick = function() { resolveApproval(requestId, false); };
  scrollDown();
}

async function resolveApproval(requestId, approved) {
  const card = document.getElementById('approval-' + requestId);
  if (card) {
    const actionsEl = card.querySelector('.actions');
    if (actionsEl) {
      const badgeClass = approved ? 'approved' : 'rejected';
      const badgeIcon = approved ?
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' :
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      const badgeText = approved ? 'Approved' : 'Rejected';
      actionsEl.innerHTML = '<div class="resolution-badge ' + badgeClass + '">' + badgeIcon + badgeText + '</div>';
      card.classList.add('resolved');
    }
  }
  try {
    await fetch('/approve', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({request_id: requestId, approved: approved}),
    });
  } catch (e) {
    addError('Approval failed: ' + e.message);
  }
}

// ---- sessions ----
async function loadSessions() {
  try {
    const res = await fetch('/sessions');
    sessions = await res.json();
    renderSessions();
  } catch (e) {
    console.error('loadSessions failed', e);
  }
}

function renderSessions() {
  const list = document.getElementById('session-list');
  list.innerHTML = '';
  for (const s of sessions) {
    const div = document.createElement('div');
    div.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
    div.onclick = function() { switchSession(s.id); };
    div.innerHTML = '<span class="icon">' + (s.id === currentSessionId ? '●' : '○') + '</span><span class="title">' + escapeHtml(s.title) + '</span>';
    list.appendChild(div);
  }
}

async function createSession() {
  try {
    const res = await fetch('/sessions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({title: 'New Chat'}),
    });
    const session = await res.json();
    currentSessionId = session.id;
    document.getElementById('current-session-title').textContent = session.title;
    msgs.innerHTML = '<div class="welcome" id="welcome"><div class="welcome-icon">&#x2699;&#xfe0f;</div><h3>MultiClaw Agent</h3><p>Ask me anything, run tools, or create plans.</p></div>';
    await loadSessions();
  } catch (e) {
    console.error('createSession failed', e);
  }
}

function switchSession(id) {
  currentSessionId = id;
  const s = sessions.find(function(s) { return s.id === id; });
  if (s) document.getElementById('current-session-title').textContent = s.title;
  msgs.innerHTML = '<div class="welcome" id="welcome"><div class="welcome-icon">&#x2699;&#xfe0f;</div><h3>MultiClaw Agent</h3><p>Ask me anything, run tools, or create plans.</p></div>';
  renderSessions();
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.style.display = sidebar.style.display === 'none' ? 'flex' : 'none';
}

// ---- send ----
async function send() {
  const text = input.value.trim();
  if (!text || btn.disabled) return;
  addMessage('user', text);
  input.value = '';
  input.style.height = 'auto';
  btn.disabled = true;
  showThinking();

  try {
    const body = {message: text};
    if (currentSessionId) body.session_id = currentSessionId;
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});

      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = JSON.parse(line.slice(6));

        if (data.type === 'session') {
          if (!currentSessionId) {
            currentSessionId = data.session_id;
            document.getElementById('current-session-title').textContent = data.title;
            loadSessions();
          }
        } else if (data.type === 'reasoning') {
          showReasoning(data.content);
        } else if (data.type === 'token') {
          appendToken(data.content);
        } else if (data.type === 'done') {
          finalizeStream(data.content);
        } else if (data.type === 'tool_call') {
          showToolCall(data.name, data.arguments);
        } else if (data.type === 'tool_result') {
          showToolResult(data.name, data.content);
        } else if (data.type === 'approval_required') {
          showApproval(data.request_id, data.tool, data.params, data.description);
        } else if (data.type === 'error') {
          finalizeStream(null);
          addError(data.content);
        }
      }
    }
  } catch (e) {
    finalizeStream(null);
    removeThinking();
    addError('Connection failed: ' + e.message);
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

function escapeHtml(s) {
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

function scrollDown() {
  msgs.scrollTop = msgs.scrollHeight;
}

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
loadSessions();
</script>
